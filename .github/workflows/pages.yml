name: Pages

# Publishes site/ (the project page and the install scripts) to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Screenshots live in docs/images for the README; copy them in.
      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp docs/images/*.png _site/images/

      # Name the artifact per attempt: "Re-run jobs" keeps the failed
      # attempt's artifact in the same run, and deploy-pages refuses to choose
      # between two artifacts with one name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
