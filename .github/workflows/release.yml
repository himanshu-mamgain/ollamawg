name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: go test -count=1 ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist/bin
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64 freebsd/amd64; do
            goos=${target%/*} goarch=${target#*/}
            ext=; [ "$goos" = windows ] && ext=.exe
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X github.com/himanshu-mamgain/ollamawg.Version=$VERSION" \
              -o dist/bin/ollamawg-$goos-$goarch$ext ./cmd/ollamawg
          done

      - name: Build npm packages
        run: node npm/build.mjs "$GITHUB_REF_NAME"

      # Platform packages first, so the launcher never points at versions that
      # do not exist yet.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist/npm/*/; do
            [ "$dir" = dist/npm/ollamawg/ ] && continue
            npm publish "$dir" --access public --provenance
          done
          npm publish dist/npm/ollamawg --access public --provenance

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/bin/* --generate-notes
