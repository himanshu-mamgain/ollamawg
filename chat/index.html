<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ollamawg chat</title>
<meta name="theme-color" content="#18211d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ollama">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="chat.css">
<script src="chat.js" defer></script>
</head>
<body>
<div class="app">
  <aside id="drawer" class="drawer" aria-label="Chats">
    <div class="drawer-head">
      <button class="new-chat" id="new-chat-side">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
    <nav id="chat-list" class="chat-list"></nav>
    <div class="drawer-foot">
      <div id="who" class="who"></div>
      <button class="link-btn" id="clear-all">Delete all chats</button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="bar">
      <button class="icon-btn" id="open-drawer" aria-label="Chats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <label class="model-pick">
        <span class="sr">Model</span>
        <select id="model"></select>
      </label>
      <button class="icon-btn" id="new-chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </header>

    <section id="thread" class="thread" aria-live="polite">
      <div id="empty" class="empty">
        <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#24302b"/><rect x="3" y="3" width="3" height="10" fill="#35A07A"/><rect x="8" y="6" width="5" height="2" fill="#fff"/><rect x="8" y="9" width="3" height="2" fill="#fff"/></svg>
        <h1>What can I help with?</h1>
        <p id="empty-sub" class="sub">Your own Ollama, through an encrypted tunnel.</p>
      </div>
      <div id="messages" class="messages"></div>
    </section>

    <form id="composer" class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Message" autocomplete="off" enterkeyhint="send"></textarea>
        <button id="send" class="send" aria-label="Send" disabled>
          <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
      </div>
      <p class="fine">Runs on your server. Models can make mistakes.</p>
    </form>
  </main>
</div>
</body>
</html>
